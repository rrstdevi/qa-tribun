name: Automated QA Testing & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-tests-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv (Python Package Manager)
        run: pip install uv

      - name: Install dependencies
        run: uv pip install -r requirements.txt --system

      # ----------------------------------------------------
      # 1. Jalankan Script QA (Contoh: Trending Tag & Latest Feed)
      # ----------------------------------------------------
      - name: Run QA Tests (Trending Tag & Latest Feed)
        env:
          PYTHONPATH: .
        run: |
          # Jalankan test trending tag
          uv run python header_tag/test_trending_tag_api.py || true
          
          # Jika Anda ingin menyalakan test latest feed juga, uncomment baris di bawah:
          # uv run python homepage/qa_main.py || true

      # ----------------------------------------------------
      # 2. Update File Index HTML Induk
      # ----------------------------------------------------
      - name: Generate Dashboard Index
        run: uv run python update_index_all.py

      # ----------------------------------------------------
      # 3. Deploy folder "output" langsung ke GitHub Pages
      # ----------------------------------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: 'output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
